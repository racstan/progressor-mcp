<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progressor</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="stylesheet" href="/styles.css">
<script>
  // Apply the saved theme before the first paint, so a light/dark choice never flashes.
  try { const t = localStorage.getItem("progressor.theme"); document.documentElement.dataset.theme = t || "vibrant"; } catch {}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
