# Publishes a release when a version tag (v0.3.0) is pushed: to npm through npm's trusted publishing
# (no token or one-time code; npm trusts this workflow file), the Docker image to GitHub's container
# registry (ghcr.io/racstan/progressor-mcp), and then to the official MCP Registry, signed in through
# GitHub. Each step skips itself if that version is already published, so a run
# can be repeated safely. "Run workflow" on the Actions tab publishes the version in package.json.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # trusted publishing on npm and the MCP Registry sign-in

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11.21.1

      - name: Check the versions agree
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          server=$(node -p "require('./server.json').version")
          package=$(node -p "require('./server.json').packages.find(p => p.registryType === 'npm').version")
          image=$(node -p "require('./server.json').packages.find(p => p.registryType === 'oci').identifier")
          if [ "$server" != "$version" ] || [ "$package" != "$version" ]; then
            echo "::error::server.json says $server / $package but package.json says $version"; exit 1
          fi
          if [ "$image" != "ghcr.io/racstan/progressor-mcp:$version" ]; then
            echo "::error::server.json's Docker image is $image, not ghcr.io/racstan/progressor-mcp:$version"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Publish to npm
        run: |
          if npm view "progressor-mcp@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "progressor-mcp ${{ steps.version.outputs.version }} is already on npm."
          else
            npm publish # prepublishOnly typechecks, tests and builds
          fi

      # The MCP Registry checks the version on npm, where a new version can take several minutes to appear.
      - name: Wait for npm to serve the version
        run: |
          for i in $(seq 1 60); do
            npm view "progressor-mcp@${{ steps.version.outputs.version }}" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "::error::progressor-mcp ${{ steps.version.outputs.version }} did not show up on npm within 10 minutes"; exit 1

  # The image for linux/amd64 and linux/arm64, tagged with the version and latest, on ghcr.io and on
  # Docker Hub (racstan/progressor-mcp; needs the DOCKERHUB_TOKEN secret, else Docker Hub is skipped
  # with a warning). It is built once: a version already on ghcr.io is copied to Docker Hub as it is,
  # and a version already on both is skipped, like the steps above.
  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.HUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: racstan
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Check where the image is already published
        id: exists
        run: |
          if docker manifest inspect "ghcr.io/racstan/progressor-mcp:$VERSION" >/dev/null 2>&1; then
            echo "ghcr.io/racstan/progressor-mcp:$VERSION is already published."
            echo "ghcr=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$HUB_TOKEN" ]; then
            echo "::warning::No DOCKERHUB_TOKEN secret, so the image is not published to Docker Hub."
            echo "hub=skip" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "docker.io/racstan/progressor-mcp:$VERSION" >/dev/null 2>&1; then
            echo "racstan/progressor-mcp:$VERSION is already on Docker Hub."
            echo "hub=skip" >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        if: steps.exists.outputs.ghcr != 'true'
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/racstan/progressor-mcp
            name=docker.io/racstan/progressor-mcp,enable=${{ steps.exists.outputs.hub != 'skip' }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=latest
      - if: steps.exists.outputs.ghcr == 'true' && steps.exists.outputs.hub != 'skip'
        name: Copy the published image to Docker Hub
        run: docker buildx imagetools create -t "docker.io/racstan/progressor-mcp:$VERSION" -t docker.io/racstan/progressor-mcp:latest "ghcr.io/racstan/progressor-mcp:$VERSION"
      - if: steps.exists.outputs.ghcr != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: env.HUB_TOKEN != ''
        name: Docker Hub page
        uses: peter-evans/dockerhub-description@v4
        with:
          username: racstan
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: racstan/progressor-mcp
          short-description: Your AI's plan, saved in your project and shown live on a dashboard. Free for personal and noncommercial use.
          readme-filepath: docs/dockerhub.md

  # The MCP Registry checks that the npm package and the Docker image exist, so this runs after both.
  registry:
    needs: [release, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          name=$(node -p "encodeURIComponent(require('./server.json').name)")
          # Ask for this exact version: the search listing is cached and can lag behind.
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.modelcontextprotocol.io/v0/servers/$name/versions/${{ needs.release.outputs.version }}")
          if [ "$status" = "200" ]; then
            echo "Version ${{ needs.release.outputs.version }} is already in the MCP Registry."
          else
            ./mcp-publisher login github-oidc
            ./mcp-publisher publish
          fi
