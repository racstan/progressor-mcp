# Publishes a release when a version tag (v0.3.0) is pushed: to npm through npm's trusted publishing
# (no token or one-time code; npm trusts this workflow file), the Docker image to GitHub's container
# registry (ghcr.io/racstan/progressor-mcp), the Python package to PyPI through PyPI's trusted
# publishing (no token either), and then to the official MCP Registry, signed in through GitHub. Each step skips itself if that version is already published, so a run
# can be repeated safely. "Run workflow" on the Actions tab publishes the version in package.json.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # trusted publishing on npm and the MCP Registry sign-in

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11.21.1

      - name: Check the versions agree
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          server=$(node -p "require('./server.json').version")
          package=$(node -p "require('./server.json').packages.find(p => p.registryType === 'npm').version")
          image=$(node -p "require('./server.json').packages.find(p => p.registryType === 'oci').identifier")
          pypi=$(node -p "require('./server.json').packages.find(p => p.registryType === 'pypi')?.version")
          if [ "$server" != "$version" ] || [ "$package" != "$version" ]; then
            echo "::error::server.json says $server / $package but package.json says $version"; exit 1
          fi
          if [ "$image" != "ghcr.io/racstan/progressor-mcp:$version" ]; then
            echo "::error::server.json's Docker image is $image, not ghcr.io/racstan/progressor-mcp:$version"; exit 1
          fi
          # PyPI spells test versions differently (1.5.0b1), so only a release version is checked here;
          # the pypi job checks the built package against server.json either way.
          if [[ "$version" != *-* ]] && [ "$pypi" != "$version" ]; then
            echo "::error::server.json's PyPI package says $pypi but package.json says $version"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Publish to npm
        run: |
          if npm view "progressor-mcp@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "progressor-mcp ${{ steps.version.outputs.version }} is already on npm."
          else
            npm publish # prepublishOnly typechecks, tests and builds
          fi

      # The MCP Registry checks the version on npm, where a new version can take several minutes to appear.
      - name: Wait for npm to serve the version
        run: |
          for i in $(seq 1 60); do
            npm view "progressor-mcp@${{ steps.version.outputs.version }}" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "::error::progressor-mcp ${{ steps.version.outputs.version }} did not show up on npm within 10 minutes"; exit 1

  # The image for linux/amd64 and linux/arm64, tagged with the version and latest, on ghcr.io and on
  # Docker Hub (rachitasthana/progressor-mcp; needs the DOCKERHUB_TOKEN secret, else Docker Hub is skipped
  # with a warning). It is built once: a version already on ghcr.io is copied to Docker Hub as it is,
  # and a version already on both is skipped, like the steps above.
  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.HUB_TOKEN != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: rachitasthana
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Check where the image is already published
        id: exists
        run: |
          if docker manifest inspect "ghcr.io/racstan/progressor-mcp:$VERSION" >/dev/null 2>&1; then
            echo "ghcr.io/racstan/progressor-mcp:$VERSION is already published."
            echo "ghcr=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$HUB_TOKEN" ]; then
            echo "::warning::No DOCKERHUB_TOKEN secret, so the image is not published to Docker Hub."
            echo "hub=skip" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "docker.io/rachitasthana/progressor-mcp:$VERSION" >/dev/null 2>&1; then
            echo "rachitasthana/progressor-mcp:$VERSION is already on Docker Hub."
            echo "hub=skip" >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        if: steps.exists.outputs.ghcr != 'true'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ghcr.io/racstan/progressor-mcp
            name=docker.io/rachitasthana/progressor-mcp,enable=${{ steps.exists.outputs.hub != 'skip' }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=latest
      - if: steps.exists.outputs.ghcr == 'true' && steps.exists.outputs.hub != 'skip'
        name: Copy the published image to Docker Hub
        run: docker buildx imagetools create -t "docker.io/rachitasthana/progressor-mcp:$VERSION" -t docker.io/rachitasthana/progressor-mcp:latest "ghcr.io/racstan/progressor-mcp:$VERSION"
      - if: steps.exists.outputs.ghcr != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: env.HUB_TOKEN != ''
        name: Docker Hub page
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4.0.2
        with:
          username: rachitasthana
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: rachitasthana/progressor-mcp
          short-description: Your AI's plan, saved in your project and shown live on a dashboard. Free for personal and noncommercial use.
          readme-filepath: docs/dockerhub.md

  # The Python package (python/): the same built Progressor, run with Node from nodejs-wheel-binaries,
  # so `uvx progressor-mcp` needs no Node. PyPI trusts this workflow file (a trusted publisher set up on
  # pypi.org for racstan/progressor-mcp, release.yml), so no token is stored.
  pypi:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Build the Python package
        id: build
        run: |
          npm run build:python
          python -m pip install --quiet build==1.3.0
          python -m build python
          py=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' python/src/progressor_mcp/_version.py)
          listed=$(node -p "require('./server.json').packages.find(p => p.registryType === 'pypi').version")
          if [ "$py" != "$listed" ]; then
            echo "::error::The Python package is $py but server.json lists $listed"; exit 1
          fi
          echo "version=$py" >> "$GITHUB_OUTPUT"
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/progressor-mcp/$py/json")" = "200" ]; then
            echo "progressor-mcp $py is already on PyPI."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to PyPI
        if: steps.build.outputs.published != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: python/dist/
      # The MCP Registry reads the package's page on PyPI, which can take a moment to show a new version.
      - name: Wait for PyPI to serve the version
        run: |
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/progressor-mcp/${{ steps.build.outputs.version }}/json")" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::progressor-mcp ${{ steps.build.outputs.version }} did not show up on PyPI within 10 minutes"; exit 1

  # The MCP Registry checks that the npm package, the Docker image and the PyPI package exist, so this
  # runs after all three.
  registry:
    needs: [release, docker, pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          name=$(node -p "encodeURIComponent(require('./server.json').name)")
          # Ask for this exact version: the search listing is cached and can lag behind.
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.modelcontextprotocol.io/v0/servers/$name/versions/${{ needs.release.outputs.version }}")
          if [ "$status" = "200" ]; then
            echo "Version ${{ needs.release.outputs.version }} is already in the MCP Registry."
          else
            ./mcp-publisher login github-oidc
            ./mcp-publisher publish
          fi
